<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thin Viewport • Policy Rule Builder</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/htmx.min.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-amber-500 selection:text-black antialiased"
      hx-sync="this:queue">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-900/60 backdrop-blur sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-sm">
          ⚡
        </div>
        <div>
          <h1 class="font-bold text-base tracking-tight text-zinc-100 flex items-center gap-2">
            Thin Viewport <span class="text-xs px-2 py-0.5 rounded bg-zinc-800 border border-zinc-700 text-zinc-400 font-mono">Boilerplate</span>
          </h1>
          <p class="text-xs text-zinc-500 hidden sm:block">Zero-DB SSR • Stateless Cookies • Ephemeral Cloud Workers</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <a href="/export" class="text-xs px-3 py-1.5 rounded-lg border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 font-medium transition flex items-center gap-1.5">
          <span>💾</span> Export JSON
        </a>
        <label class="text-xs px-3 py-1.5 rounded-lg border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 font-medium transition cursor-pointer flex items-center gap-1.5">
          <span>📂</span> Import JSON
          <input type="file" name="file" class="hidden"
                 hx-post="/import"
                 hx-encoding="multipart/form-data"
                 hx-target="#workspace"
                 hx-swap="innerHTML"
                 onchange="htmx.trigger(this, 'change')">
        </label>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-6">

    <!-- FTS5 Typeahead Search Bar -->
    <div class="relative w-full">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500 text-sm">
          🔍
        </span>
        <input type="search"
               name="q"
               placeholder="Search 16 Cloud & Security Policies (e.g. TLS, Encryption, MFA, Container, SOC2)..."
               autocomplete="off"
               class="w-full pl-10 pr-4 py-3 rounded-xl bg-zinc-900/90 border border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 text-sm transition shadow-inner"
               hx-get="/search"
               hx-trigger="input changed delay:150ms, search, refreshSearch from:body"
               hx-target="#search-results"
               hx-swap="innerHTML">
      </div>
      <!-- Dropdown Results -->
      <div id="search-results" class="relative z-20"></div>
    </div>

    <!-- Dynamic Workspace (Lazy-loaded by Edge Shell) -->
    <div id="workspace" hx-get="/workspace" hx-trigger="load" hx-swap="innerHTML">
      <div class="p-12 text-center text-zinc-500 animate-pulse text-xs">
        Loading policy workspace...
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-zinc-900 bg-zinc-950 py-6 text-center text-xs text-zinc-600">
    Thin Viewport Architecture Reference • Stateless Cookie Sessions • MIT Licensed
  </footer>

</body>
</html>
