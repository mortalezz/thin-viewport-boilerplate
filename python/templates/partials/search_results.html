{% if results %}
<div class="absolute top-1 left-0 right-0 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl overflow-hidden divide-y divide-zinc-800/60 max-h-96 overflow-y-auto">
  {% for item in results %}
  <div class="p-3 hover:bg-zinc-800/40 transition flex items-center justify-between gap-4 text-xs">
    <div class="space-y-1 flex-1">
      <div class="flex items-center gap-2">
        <span class="font-semibold text-zinc-100">{{ item.name }}</span>
        <span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-zinc-800 text-zinc-400 border border-zinc-700/60">{{ item.category }}</span>
        <span class="px-1.5 py-0.5 rounded text-[10px] font-mono
          {% if item.severity == 'Critical' %}bg-red-950 text-red-400 border border-red-800/50
          {% elif item.severity == 'High' %}bg-amber-950 text-amber-400 border border-amber-800/50
          {% else %}bg-zinc-800 text-zinc-400{% endif %}">
          {{ item.severity }}
        </span>
      </div>
      <p class="text-zinc-400 text-[11px] leading-relaxed">{{ item.description }}</p>
    </div>

    <form hx-post="/policy/toggle" hx-target="#workspace" hx-swap="innerHTML">
      <input type="hidden" name="policy_id" value="{{ item.policy_id }}">
      {% if item.policy_id in active_policies %}
      <button type="submit" class="px-3 py-1.5 rounded-lg border border-red-500/30 bg-red-950/40 hover:bg-red-900/60 text-red-300 font-medium transition whitespace-nowrap">
        Remove
      </button>
      {% else %}
      <button type="submit" class="px-3 py-1.5 rounded-lg border border-amber-500/40 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 font-medium transition whitespace-nowrap">
        + Add
      </button>
      {% endif %}
    </form>
  </div>
  {% endfor %}
</div>
{% elif q.strip() %}
<div class="absolute top-1 left-0 right-0 bg-zinc-900 border border-zinc-800 rounded-xl p-4 text-center text-xs text-zinc-500 shadow-2xl">
  No policies found matching "<span class="text-zinc-300">{{ q }}</span>"
</div>
{% endif %}
