[package]
name = "thin-viewport-rs"
version = "0.1.0"
edition = "2021"
description = "High-performance Axum + Stateless Cookie Single-Binary Port of Thin Viewport Boilerplate"

[dependencies]
axum = { version = "0.7", features = ["multipart", "form"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
base64 = "0.22"
tower-http = { version = "0.5", features = ["fs"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
